name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true turns Pages on for this repo the first time this runs,
      # so the site can be published without visiting the Settings screen.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html before-you-book.html assets robots.txt sitemap.xml _site/
          ls -R _site | head -30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
