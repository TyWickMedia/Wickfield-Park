<!-- Wickfield mark — the W is the field, the sun above it.
     Drawn as paths (no text), so it stays sharp at favicon size and needs no font. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Wickfield RV Park">
  <rect width="200" height="200" rx="30" fill="#2F3C2C"/>
  <circle cx="100" cy="62" r="21" fill="#B8571F"/>
  <path d="M30 94 L 63 150 L 100 106 L 137 150 L 170 94" fill="none" stroke="#E7DFC6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 172 h128" stroke="#5C7048" stroke-width="8" stroke-linecap="round"/>
</svg>
