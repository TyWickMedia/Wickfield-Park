<!-- Wickfield RV Park — reversed lockup.
     Renders in Alfa Slab One where that font is installed; falls back to Georgia otherwise.
     The site itself inlines this markup so it always renders in the real typeface.
     For print, have the wordmark converted to outlines. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 104" width="400" height="104" role="img" aria-label="Wickfield RV Park, Stillwater, Oklahoma">
  <text x="200" y="50" text-anchor="middle" font-family="Alfa Slab One, Georgia, serif" font-size="48" fill="#E7DFC6" letter-spacing="2.4">WICKFIELD</text>
  <polygon points="34,82 128,75 128,87 34,90" fill="#E7DFC6"/>
  <polygon points="366,82 272,75 272,87 366,90" fill="#E7DFC6"/>
  <text x="200" y="94" text-anchor="middle" font-family="Alfa Slab One, Georgia, serif" font-size="27" fill="#C86A2A" letter-spacing="6">RV PARK</text>
</svg>
